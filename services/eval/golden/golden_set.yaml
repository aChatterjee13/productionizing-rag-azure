# Golden set — requirement #8.
#
# Every identifier here comes from scripts/seed_demo_tenant.py: tenant ids, persona
# keys, document ids, chunk ids (`{document_id}::{index:04d}`) and the canary tokens.
# Run `uv run python scripts/seed_demo_tenant.py --purge` before evaluating.
#
# Categories (ragcore.models.eval.EvalCategory), and what each one proves:
#
#   in_domain       the corpus answers it — single-hop, multi-hop, faceted, table
#   out_of_domain   nothing indexed answers it, so the pipeline must refuse
#   pii             the answer must not carry the entities the egress scan redacts
#   contradiction   two sources disagree; the answer must surface both
#   acl_negative    a persona must not receive material it may not read
#   tool_required   the answer needs data that is not in any document
#
# Conventions:
#   * `must_not_contain` on an acl_negative item lists that persona's forbidden
#     canary tokens (seed_demo_tenant.forbidden_canaries_for) plus the distinctive
#     values of the hidden document. A hit there is an ACL leak, not a quality miss.
#   * `ground_truth` on a refusal item is a realistic refusal, because semantic
#     similarity is scored against it.
#   * `expected_chunk_ids` is only set where the answer must come from one specific
#     chunk. The expense-claims paragraph is duplicated verbatim between the travel
#     policy and the onboarding handbook, so dedupe legitimately drops one copy —
#     those items name no expected chunk.

items:
  # ======================================================== in_domain, single hop
  - item_id: gi-001-meal-allowance-current
    question: What is the daily meal allowance for Acme business travel?
    ground_truth: >-
      Employees claim a flat daily meal allowance of EUR 60 per full day away from
      their usual place of work under the 2025 travel policy, which superseded the
      EUR 45 rate on 1 April 2025.
    expected_document_ids: [doc-acme-travel-2025]
    expected_chunk_ids: ["doc-acme-travel-2025::0000"]
    must_contain: ["60"]
    must_not_contain: ["EUR 30", "CANARY-GLOBEX"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-002-partial-days
    question: How are partial travel days reimbursed?
    ground_truth: Partial days are reimbursed at half the daily meal allowance rate.
    expected_document_ids: [doc-acme-travel-2025]
    must_contain: ["half"]
    as_user: acme_intern
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-003-flight-class
    question: Which class should I book for a four-hour flight?
    ground_truth: >-
      Journeys shorter than six hours are booked in economy class, so a four-hour
      flight is economy.
    expected_document_ids: [doc-acme-travel-2025]
    must_contain: ["economy"]
    as_user: acme_intern
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-004-expense-deadline
    question: How long do I have to submit an expense claim?
    ground_truth: >-
      Expense claims are submitted in the Acme Expense portal within 30 days of the
      trip, and claims older than 90 days are rejected without exception.
    must_contain: ["30"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-005-card-statements
    question: Are card statements acceptable evidence for an expense claim?
    ground_truth: >-
      No. Each claim needs an itemised receipt; card statements are not accepted as
      evidence.
    must_contain: ["receipt"]
    as_user: acme_intern
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-006-security-training
    question: By when must a new joiner finish the mandatory security awareness training?
    ground_truth: >-
      Mandatory security awareness training must be completed before the end of week
      two.
    expected_document_ids: [doc-acme-onboarding]
    expected_chunk_ids: ["doc-acme-onboarding::0000"]
    must_contain: ["week two"]
    as_user: acme_intern
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-007-remote-days
    question: How many days a week may I work remotely?
    ground_truth: >-
      Employees may work remotely up to three days a week with their manager's
      agreement; roles requiring physical presence on the production floor are
      excluded.
    expected_document_ids: [doc-acme-remote-work]
    expected_chunk_ids: ["doc-acme-remote-work::0000"]
    must_contain: ["three"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-008-home-office-stipend
    question: How much is the one-off home-office stipend and what does it cover?
    ground_truth: >-
      The one-off home-office stipend is EUR 400 and covers a desk, a chair or a
      lamp. It is claimed once per employee.
    expected_document_ids: [doc-acme-remote-work]
    must_contain: ["400"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-009-vpn-flap
    question: The VPN tunnel flaps every 30 seconds. What is the cause and the fix?
    ground_truth: >-
      The cause is a rekey mismatch between the two concentrators. Drain node vpn-b,
      force a rekey with a 600-second lifetime on both peers, then return the node to
      the pool once three consecutive keepalives succeed.
    expected_document_ids: [doc-acme-vpn-runbook]
    expected_chunk_ids: ["doc-acme-vpn-runbook::0000"]
    must_contain: ["rekey"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-010-globex-meal-allowance
    question: What is the daily meal allowance for Globex business travel?
    ground_truth: >-
      Employees claim a flat daily meal allowance of EUR 30 per full day away from
      their usual place of work.
    expected_document_ids: [doc-globex-travel-policy]
    expected_chunk_ids: ["doc-globex-travel-policy::0000"]
    must_contain: ["30"]
    must_not_contain: ["EUR 60", "EUR 45", "CANARY-ACME"]
    as_user: globex_analyst
    tenant_id: tenant-globex
    category: in_domain

  - item_id: gi-011-globex-trip-approval
    question: What approval does a single trip above EUR 1,500 need?
    ground_truth: >-
      Any single trip above EUR 1,500 needs written approval from a director before
      booking.
    expected_document_ids: [doc-globex-travel-policy]
    expected_chunk_ids: ["doc-globex-travel-policy::0001"]
    must_contain: ["director"]
    as_user: globex_analyst
    tenant_id: tenant-globex
    category: in_domain

  - item_id: gi-012-forklift-revalidation
    question: How often do forklift operators revalidate their licence?
    ground_truth: Forklift operators revalidate their licence every 24 months.
    expected_document_ids: [doc-globex-warehouse-safety]
    must_contain: ["24"]
    as_user: globex_analyst
    tenant_id: tenant-globex
    category: in_domain

  - item_id: gi-013-aisle-speed-limit
    question: What is the warehouse aisle speed limit?
    ground_truth: The aisle speed limit is 8 km/h.
    expected_document_ids: [doc-globex-warehouse-safety]
    expected_chunk_ids: ["doc-globex-warehouse-safety::0000"]
    must_contain: ["8"]
    as_user: globex_analyst
    tenant_id: tenant-globex
    category: in_domain

  - item_id: gi-014-first-week-checkins
    question: When does my manager schedule check-ins during my first week?
    ground_truth: >-
      The manager schedules a 30-minute check-in on day one, day three and at the end
      of week one.
    expected_document_ids: [doc-acme-onboarding]
    expected_chunk_ids: ["doc-acme-onboarding::0000"]
    as_user: acme_intern
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-015-new-joiner-equipment
    question: What equipment does a new joiner receive?
    ground_truth: New joiners receive a laptop, a headset and a monitor.
    expected_document_ids: [doc-acme-onboarding]
    expected_chunk_ids: ["doc-acme-onboarding::0002"]
    must_contain: ["laptop"]
    as_user: acme_intern
    tenant_id: tenant-acme
    category: in_domain

  # ========================================================= in_domain, multi hop
  - item_id: gi-020-stipend-twice
    question: >-
      I am a new joiner who will also work from home. Do I get the home-office
      stipend twice — once as a new joiner and once for remote work?
    ground_truth: >-
      No. The one-off home-office stipend of EUR 400 is claimed once per employee and
      it overlaps with the new joiner equipment allocation, so it is not paid twice.
    expected_document_ids: [doc-acme-remote-work, doc-acme-onboarding]
    must_contain: ["once"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-021-two-full-one-partial
    question: >-
      Under the current policy, what meal allowance do I claim for two full travel
      days plus one partial day?
    ground_truth: >-
      EUR 150: two full days at EUR 60 each plus one partial day at half the daily
      rate, which is EUR 30.
    expected_document_ids: [doc-acme-travel-2025]
    must_contain: ["150"]
    as_user: acme_intern
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-022-rail-versus-air
    question: >-
      For a five-hour journey, does the policy prefer rail or air, and what evidence
      do I need for the expense claim?
    ground_truth: >-
      Rail is preferred where the total door-to-door time is within one hour of
      flying; otherwise a journey shorter than six hours is booked in economy. The
      claim needs an itemised receipt and must be submitted within 30 days.
    expected_document_ids: [doc-acme-travel-2025]
    must_contain: ["rail"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-023-handbook-versus-policy
    question: >-
      Does the new joiner handbook say anything different from the travel policy
      about claiming expenses?
    ground_truth: >-
      No. The handbook repeats the travel policy's expense rules: claims go through
      the Acme Expense portal within 30 days, need an itemised receipt, and are
      rejected after 90 days.
    must_contain: ["30"]
    as_user: acme_admin
    tenant_id: tenant-acme
    category: in_domain

  - item_id: gi-024-globex-reversing-and-approval
    question: >-
      What must a Globex driver do before reversing in aisle block C, and what
      approval does a EUR 2,000 trip need?
    ground_truth: >-
      Reversing without a spotter is prohibited in aisle blocks C and D, so a spotter
      is required. A trip above EUR 1,500 needs written approval from a director
      before booking, so the EUR 2,000 trip needs director approval.
    expected_document_ids: [doc-globex-warehouse-safety, doc-globex-travel-policy]
    must_contain: ["spotter", "director"]
    as_user: globex_analyst
    tenant_id: tenant-globex
    category: in_domain

  - item_id: gi-025-remote-plus-travel
    question: >-
      I work remotely three days a week. If I travel to a customer for a full day,
      what do I claim and by when?
    ground_truth: >-
      A full day away from the usual place of work is claimed at the EUR 60 daily
      meal allowance, submitted in the Acme Expense portal within 30 days of the trip
      with an itemised receipt.
    expected_document_ids: [doc-acme-travel-2025]
    must_contain: ["60"]
    as_user: acme_engineer
    tenant_id: tenant-acme
    category: in_domain

