# ---------------------------------------------------------------------------------
# web/nginx.conf — server block for the React SPA.
#
# Copied to /etc/nginx/templates/default.conf.template, so the nginx entrypoint renders
# it with envsubst at container start. Only ${NGINX_PORT} and ${API_UPSTREAM} are
# substituted; nginx's own variables use the bare $name form, which envsubst leaves
# alone because no environment variable of that name is defined.
#
#   NGINX_PORT    port to listen on                     (default 80)
#   API_UPSTREAM  base URL of the API                   (default http://api:8000)
#
# Two responsibilities:
#   1. /api/** is reverse-proxied to the API, with buffering disabled so the SSE chat
#      stream reaches the browser token by token instead of arriving in one lump.
#   2. Everything else falls back to /index.html so client-side routing works on a hard
#      refresh of a deep link.
# ---------------------------------------------------------------------------------

server {
    listen ${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never trust the upstream to set these for static assets.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Container-probe target that never touches the SPA bundle.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------ API proxy
    # Server-Sent Events from POST /api/v1/chat need buffering off, HTTP/1.1 and a long
    # read timeout: a single agentic turn with tool calls can run for minutes.
    location /api/ {
        proxy_pass ${API_UPSTREAM};

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Belt and braces for intermediaries that honour it.
        add_header X-Accel-Buffering "no" always;
    }

    # ------------------------------------------------------------- static assets
    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ------------------------------------------------------------- SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
