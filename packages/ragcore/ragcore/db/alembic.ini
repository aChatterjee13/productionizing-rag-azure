; Alembic configuration for the ragcore schema.
;
; The database URL is NOT stored here. env.py reads it from ragcore.settings
; (RAG_POSTGRES_* / RAG_DATABASE_URL_OVERRIDE) so migrations and the application can
; never disagree about which database they are pointed at, and so no credential is
; ever committed.
;
; Run from anywhere with:
;   alembic -c packages/ragcore/ragcore/db/alembic.ini upgrade head
; or via `make migrate`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC

; Keep revision filenames sortable and readable: 0002_add_x.py, 0003_....
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
